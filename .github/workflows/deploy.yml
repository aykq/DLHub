name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to VDS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: root
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            set -e
            cd /opt/dlhub

            echo "==> git pull"
            git pull origin main

            echo "==> build app + migrate images"
            # Built sequentially, not "build app migrate": both Dockerfiles run an
            # identical `COPY package.json package-lock.json ./` + `RUN npm ci` step,
            # so BuildKit treats it as the same cache layer. Building app and migrate
            # in parallel lets two builds hit that layer at once, racing on esbuild's
            # postinstall (chmod+exec) and failing with ETXTBSY.
            docker compose build app
            docker compose build migrate

            echo "==> run migrations"
            docker compose --profile migrate run --rm migrate

            echo "==> restart app"
            docker compose up -d app

            echo "==> cleanup old images"
            docker image prune -f

            echo "==> done"
